[project]
name = "logicmus-eval"
version = "0.1.0"
description = "LogicMUS-Eval project"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "z3-solver>=5.1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
