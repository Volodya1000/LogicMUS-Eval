[project]
name = "logicmus-eval"
version = "0.1.0"
description = "LogicMUS-Eval project"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.102.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "z3-solver>=5.1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.uv]
package = true

[project.scripts]
logicmus-eval = "logicmus_eval.cli:app"

[tool.setuptools.packages.find]
include = ["logicmus_eval*"]
exclude = ["data*", "tests*"]
